# 產品頁內容（tools/module-pages/*.json）推到 main 之後，重新產頁、重建字型與圖示子集，
# 有變動就 commit 回 main，並請 GitHub Pages 重新建置。內容有錯時這一步會失敗、不會 commit。
name: Build product pages

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'llms.txt'
      - 'sitemap.xml'
      - 'css/**'
      - 'js/site-search.js'
      - 'search-index.json'
      - 'tools/build-og-images.py'
      - 'tools/module-pages/**'
      - 'tools/build-module-pages.py'
      - 'tools/cms/**'
      - 'css/nexus-module.css'
      - '.github/workflows/build-product-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-product-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font tools
        run: pip install fonttools brotli pillow

      - name: Test the generator and editor
        run: CMS_SKIP_FONTS=1 python3 tools/cms/test_cms.py

      # 每頁的社群分享圖：只畫內容有變的，Runner 內建 Chrome
      - name: Share images
        run: python3 tools/build-og-images.py

      - name: Build pages
        run: python3 tools/build-module-pages.py

      # 模擬潛在客戶的搜尋考題：命中率低於門檻就停在這裡，不發布
      - name: Site search quality
        run: |
          node tools/search-eval/run.js | tee search.txt
          { echo '## 網站搜尋考題'; echo '```'; cat search.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm search.txt

      - name: SEO / GEO report
        run: |
          python3 tools/build-module-pages.py --audit | tee audit.txt
          { echo '## SEO / GEO 檢查'; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm audit.txt

      # 字型子集只在網站出現子集沒有的中文字時才重建：不同版本的 fonttools 產出位元組不同，
      # 每次都重建會在沒有新字時也多一筆 commit
      - name: Rebuild font and icon subsets
        run: |
          if python3 - <<'PY'
          import glob, io, sys
          from fontTools.ttLib import TTFont
          chars = set()
          for f in glob.glob('*.html') + glob.glob('blogpost/*.html') + glob.glob('*.txt') + glob.glob('css/*.css') + glob.glob('js/*.js') + glob.glob('search-index.json'):
              chars |= set(io.open(f, encoding='utf-8', errors='ignore').read())
          full = set(TTFont('WOFF2/LINESeedTW_OTF_Rg.woff2').getBestCmap())
          cmap = set(TTFont('WOFF2/LINESeedTW_OTF_Rg.subset.woff2').getBestCmap())
          # 只算完整字型有、子集沒有的字（完整字型本來就沒有的字，例如簡體字，重建也補不進來）
          missing = sorted(c for c in chars if ord(c) in full and ord(c) not in cmap)
          print('字型子集缺 %d 字' % len(missing), ''.join(missing[:40]))
          # 完整字型沒有、但落在它 unicode-range 裡的字：每頁會為了找它多載 3.3 MB，要重算 range
          import re
          css = io.open('css/line-seed-font.css', encoding='utf-8').read()
          ur = re.search(r"LINESeedTW_OTF_Rg\.woff2'\) format\('woff2'\);\n  unicode-range: ([^;]+);", css).group(1)
          spans = [tuple(int(x, 16) for x in r.strip()[2:].split('-')) for r in ur.split(',')]
          claimed = [c for c in chars if ord(c) not in full and any(s[0] <= ord(c) <= s[-1] for s in spans)]
          print('完整字型 range 誤含 %d 字' % len(claimed), ''.join(sorted(claimed)[:40]))
          sys.exit(0 if missing or claimed else 1)
          PY
          then bash tools/build-font-subset.sh; fi
          bash tools/build-iconoir-subset.sh

      - name: Commit regenerated files
        id: commit
        run: |
          git add -A -- '*.html' llms.txt llms-full.txt sitemap.xml search-index.json images/og css/line-seed-font.css css/iconoir-subset.css WOFF2
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "產出與 repo 內容一致，不需要 commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(build): regenerate product pages"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 用 GITHUB_TOKEN 推的 commit 不一定會觸發 Pages 建置，主動請求一次
      - name: Request a GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 建置請求失敗，可在 Settings → Pages 手動重建"

      # IndexNow：Pages 建置完成後，通知 Bing 等支援 IndexNow 的搜尋引擎哪些網址更新了（Google 不支援，需用 Search Console）
      - name: Notify search engines (IndexNow)
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status 2>/dev/null || echo unknown)
            [ "$status" = "built" ] && break
            sleep 15
          done
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          KEY = '8a26a98adce85abe99c2370c8828e900'
          SITE = 'https://aurobase.com'
          before = os.environ.get('BEFORE', '')
          if before and not set(before) <= {'0'}:
              out = subprocess.run(['git', 'diff', '--name-only', before, 'HEAD', '--', '*.html'], capture_output=True, text=True).stdout
              files = [f for f in out.split() if not f.startswith(('archive/', 'tools/'))]
              urls = [SITE + '/' + ('' if f == 'index.html' else f) for f in files]
          else:
              urls = re.findall(r'<loc>([^<]+)</loc>', open('sitemap.xml', encoding='utf-8').read())
          if not urls:
              print('沒有變動的網頁，不送 IndexNow'); raise SystemExit(0)
          body = json.dumps({'host': 'aurobase.com', 'key': KEY, 'keyLocation': SITE + '/' + KEY + '.txt', 'urlList': urls[:10000]}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              print('IndexNow', urllib.request.urlopen(req, timeout=30).status, len(urls), '個網址')
          except Exception as e:
              print('IndexNow 送出失敗（不影響發布）：', e)
          PY

